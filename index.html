<!DOCTYPE html>
<html>
<head>
  <title>Cloud Dictionary</title>
</head>
<body>
  <h1>Serverless Cloud Dictionary</h1>
  <input id="term" placeholder="Enter a cloud term..." />
  <button onclick="lookup()">Search</button>
  <p id="result"></p>

  <script>
    async function lookup() {
      const term = document.getElementById('term').value.trim();
      if (!term) {
        document.getElementById('result').innerText = "Please enter a term.";
        return;
      }
      try {
        const res = await fetch(`https://04ifkvutxd.execute-api.eu-north-1.amazonaws.com`);
        const data = await res.json();
        document.getElementById('result').innerText =
          data.definition || data.message || data.error || "No definition found.";
      } catch (err) {
        document.getElementById('result').innerText = "Error: " + err;
      }
    }
  </script>
</body>
</html>
